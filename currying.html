<script>

console.log("----- Section 7: Currying -----");

//23
function add(a){
return function(b){
return function(c){
return a+b+c;
}
}
}

console.log("Sum:", add(2)(3)(4));

//24
function multiply(a){
return function(b){
return function(c){
return a*b*c;
}
}
}

console.log("Multiply:", multiply(2)(3)(4));

</script>
